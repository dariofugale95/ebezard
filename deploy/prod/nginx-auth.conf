events {}

http {
    server {
        listen 443 ssl;
        server_name auth-prod;

        ssl_certificate     /etc/nginx/certs/auth-cert.pem;
        ssl_certificate_key /etc/nginx/certs/auth-key.pem;
        ssl_client_certificate /etc/nginx/certs/ca-cert.pem;
        ssl_verify_client on;

        location / {
            proxy_pass http://auth-prod:8003;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}