server {
    listen 443 ssl;
    server_name api-gateway-prod;

    ssl_certificate /etc/ssl/certs/nginx-apigateway-prod-cert.pem;
    ssl_certificate_key /etc/ssl/keys/nginx-apigateway-prod-key.pem;
    ssl_client_certificate /etc/ssl/certs/ca-cert.pem;
    ssl_verify_client on;

    location / {
        proxy_pass http://landing-prod:8088/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://apigateway-prod:8300/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}