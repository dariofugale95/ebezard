events {}

http {
    server {
        listen 443 ssl;
        server_name marketplace-prod;

        ssl_certificate     /etc/nginx/certs/marketplace-cert.pem;
        ssl_certificate_key /etc/nginx/certs/marketplace-key.pem;
        ssl_client_certificate /etc/nginx/certs/ca-cert.pem;
        ssl_verify_client on;

        location / {
            proxy_pass http://marketplace-prod:8200;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}