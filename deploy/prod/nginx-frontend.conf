server {
    listen 446 ssl;
    server_name frontend-prod;

    ssl_certificate     /etc/nginx/certs/frontend-cert.pem;
    ssl_certificate_key /etc/nginx/certs/frontend-key.pem;
    ssl_client_certificate /etc/nginx/certs/ca-cert.pem;
    ssl_verify_client on;

    location / {
        proxy_pass https://frontend-prod:5180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}