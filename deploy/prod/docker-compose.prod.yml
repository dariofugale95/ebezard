###############################################
# ENVIRONMENT VARIABLE MANAGEMENT (BACKEND AND FRONTEND)
#
# All configuration variables (backend and frontend, including ports) are centralized in:
#   .env.dev  (for development, in this folder)
#   .env.prod (for production, in this folder)
#
# Edit these files to change ports or variables for backend and frontend.
# Docker Compose uses only these files as env_file for all services.
###############################################
services:
  backend-prod:
    build:
      context: ../../ebezard-backend
      dockerfile: Dockerfile-prod
    container_name: ${PROJECT_NAME}-backend-prod
    env_file:
      - .env
    environment:
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
    ports:
      - "${BACKEND_PORT_SOURCE}:${BACKEND_PORT_TARGET}"
    volumes:
      - ../../ebezard-backend:/app                               # Mount backend source code
      - ../../ebezard-backend/media:/app/media                   # Mount media directory
      - ../../ca/certs/ca-cert.pem:/certs/ca-cert.pem:ro
      - ../../ca/certs/backend-cert.pem:/certs/backend-cert.pem:ro
      - ../../ca/keys/backend-key.pem:/certs/backend-key.pem:ro
    command: >
      sh -c "python manage.py collectstatic --noinput && \
             python manage.py runserver 0.0.0.0:${BACKEND_PORT_TARGET}"
    depends_on:
      - db-prod

  nginx-backend-prod:
    image: nginx:latest
    container_name: ${PROJECT_NAME}-${NGINX_BACKEND_HOST}-prod
    ports:
      - "${NGINX_BACKEND_PORT_SOURCE}:${NGINX_BACKEND_PORT_TARGET}"
    volumes:
      - ./deploy/prod/nginx-backend.conf:/etc/nginx/nginx.conf:ro
      - ${NGINX_BACKEND_CERT_PATH}:/etc/nginx/certs/backend-cert.pem:ro
      - ${NGINX_BACKEND_KEY_PATH}:/etc/nginx/certs/backend-key.pem:ro
      - ${NGINX_BACKEND_CA_PATH}:/etc/nginx/certs/ca-cert.pem:ro
    depends_on:
      - backend-prod

  frontend-prod:
    build:
      context: ../../ebezard-frontend/frontend
      dockerfile: Dockerfile-prod
    container_name: ${PROJECT_NAME}-frontend-prod
    env_file:
      - .env
    environment:
      VITE_TEST_ENV: ${VITE_TEST_ENV}
      VITE_BACKEND_URL: ${VITE_BACKEND_URL}
      VITE_PROJECT_NAME: ${VITE_PROJECT_NAME}
      FRONTEND_PORT_TARGET: ${FRONTEND_PORT_TARGET}
    ports:
      - "${FRONTEND_PORT_SOURCE}:${FRONTEND_PORT_TARGET}"
    volumes:
      - ../../ebezard-frontend/frontend:/app                     # Mount frontend source code
      - /app/node_modules                                        # Persist node_modules for faster installs
      - ../../ca/certs/ca-cert.pem:/certs/ca-cert.pem:ro
      - ../../ca/certs/frontend-cert.pem:/certs/frontend-cert.pem:ro
      - ../../ca/keys/frontend-key.pem:/certs/frontend-key.pem:ro
    depends_on:
      - backend-prod

  nginx-frontend-prod:
    image: nginx:latest
    container_name: ${PROJECT_NAME}-${NGINX_FRONTEND_HOST}-prod
    ports:
      - "${NGINX_FRONTEND_PORT_SOURCE}:${NGINX_FRONTEND_PORT_TARGET}"
    volumes:
      - ./deploy/prod/nginx-frontend.conf:/etc/nginx/nginx.conf:ro
      - ${NGINX_FRONTEND_CERT_PATH}:/etc/nginx/certs/frontend-cert.pem:ro
      - ${NGINX_FRONTEND_KEY_PATH}:/etc/nginx/certs/frontend-key.pem:ro
      - ${NGINX_FRONTEND_CA_PATH}:/etc/nginx/certs/ca-cert.pem:ro
    depends_on:
      - frontend-prod

  db-prod:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME}-db-prod
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT_TARGET: ${DB_PORT_TARGET}
    ports:
      - "${DB_PORT_SOURCE}:${DB_PORT_TARGET}"
    volumes:
      - pgdata-prod:/var/lib/postgresql/data

  apigateway-prod:
    build:
      context: ../../ebezard-apigateway
      dockerfile: Dockerfile-prod
    container_name: ${PROJECT_NAME}-apigateway-prod
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL}
    ports:
      - "${APIGATEWAY_PORT_SOURCE}:${APIGATEWAY_PORT_TARGET}"  # Host:Container port mapping for API Gateway
    volumes:
      - ../../ebezard-apigateway/app:/app/app                    # Mount API Gateway source code
      - ../../ca/certs/ca-cert.pem:/certs/ca-cert.pem:ro
      - ../../ca/certs/apigateway-cert.pem:/certs/apigateway-cert.pem:ro
      - ../../ca/keys/apigateway-key.pem:/certs/apigateway-key.pem:ro
    depends_on:
      - redis-prod

  nginx-apigateway-prod:
    image: nginx:latest
    container_name: ${PROJECT_NAME}-${NGINX_APIGATEWAY_HOST}-prod
    ports:
      - "${NGINX_APIGATEWAY_PORT_SOURCE}:${NGINX_APIGATEWAY_PORT_TARGET}"
    volumes:
      - ./deploy/prod/nginx-apigateway.conf:/etc/nginx/nginx.conf:ro
      - ${NGINX_APIGATEWAY_CERT_PATH}:/etc/nginx/certs/apigateway-cert.pem:ro
      - ${NGINX_APIGATEWAY_KEY_PATH}:/etc/nginx/certs/apigateway-key.pem:ro
      - ${NGINX_APIGATEWAY_CA_PATH}:/etc/nginx/certs/ca-cert.pem:ro
    depends_on:
      - apigateway-prod

  landing-prod:
    build:
      context: ../../ebezard-landing/frontend
      dockerfile: Dockerfile-prod
      args:
        LANDING_PORT_TARGET: ${LANDING_PORT_TARGET}
    container_name: ${PROJECT_NAME}-landing-prod
    env_file:
      - .env
    environment:
      VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL}
      VITE_PROJECT_NAME: ${PROJECT_NAME}
      LANDING_PORT_TARGET: ${LANDING_PORT_TARGET}
    ports:
      - "${LANDING_PORT_SOURCE}:${LANDING_PORT_TARGET}"
    volumes:
      - ../../ebezard-landing/frontend:/app                      # Mount landing source code
      - /app/node_modules                                        # Persist node_modules for faster installs
      - ../../ca/certs/ca-cert.pem:/certs/ca-cert.pem:ro
      - ../../ca/certs/backend-cert.pem:/certs/backend-cert.pem:ro
      - ../../ca/keys/backend-key.pem:/certs/backend-key.pem:ro
    depends_on:
      - apigateway-prod

  nginx-landing-prod:
    image: nginx:latest
    container_name: ${PROJECT_NAME}-${NGINX_LANDING_HOST}-prod
    ports:
      - "${NGINX_LANDING_PORT_SOURCE}:${NGINX_LANDING_PORT_TARGET}"
    volumes:
      - ./deploy/prod/nginx-landing.conf:/etc/nginx/nginx.conf:ro
      - ${NGINX_LANDING_CERT_PATH}:/etc/nginx/certs/landing-cert.pem:ro
      - ${NGINX_LANDING_KEY_PATH}:/etc/nginx/certs/landing-key.pem:ro
      - ${NGINX_LANDING_CA_PATH}:/etc/nginx/certs/ca-cert.pem:ro
    depends_on:
      - landing-prod

