###############################################
# ENVIRONMENT VARIABLE MANAGEMENT (BACKEND AND FRONTEND)
#
# All configuration variables (backend and frontend, including ports) are centralized in:
#   .env.dev  (for development, in this folder)
#   .env.prod (for production, in this folder)
#
# Edit these files to change ports or variables for backend and frontend.
# Docker Compose uses only these files as env_file for all services.
###############################################
services:
  backend-prod:
    build:
      context: ../../ebezard-backend
      dockerfile: Dockerfile-prod
    container_name: ${PROJECT_NAME}-backend-prod
    env_file:
      - .env
    environment:
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
    ports:
      - "${BACKEND_PORT_SOURCE}:${BACKEND_PORT_TARGET}"
    volumes:
      - ../../ebezard-backend:/app                               # Mount backend source code
      - ../../ebezard-backend/media:/app/media                   # Mount media directory
    command: >
      sh -c "python manage.py collectstatic --noinput && \
             python manage.py runserver 0.0.0.0:${BACKEND_PORT_TARGET}"
    depends_on:
      - db-prod

  frontend-prod:
    build:
      context: ../../ebezard-frontend/frontend
      dockerfile: Dockerfile-prod
    container_name: ${PROJECT_NAME}-frontend-prod
    env_file:
      - .env
    environment:
      VITE_TEST_ENV: ${VITE_TEST_ENV}
      VITE_BACKEND_URL: ${VITE_BACKEND_URL}
      VITE_PROJECT_NAME: ${VITE_PROJECT_NAME}
      FRONTEND_PORT_TARGET: ${FRONTEND_PORT_TARGET}
    ports:
      - "${FRONTEND_PORT_SOURCE}:${FRONTEND_PORT_TARGET}"
    volumes:
      - ../../ebezard-frontend/frontend:/app                     # Mount frontend source code
      - /app/node_modules                                        # Persist node_modules for faster installs
    depends_on:
      - backend-prod

  db-prod:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME}-db-prod
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT_TARGET: ${DB_PORT_TARGET}
    ports:
      - "${DB_PORT_SOURCE}:${DB_PORT_TARGET}"
    volumes:
      - pgdata-prod:/var/lib/postgresql/data

  apigateway-prod:
    build:
      context: ../../ebezard-apigateway
      dockerfile: Dockerfile-prod
    container_name: ${PROJECT_NAME}-apigateway-prod
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL}
    ports:
      - "${APIGATEWAY_PORT_SOURCE}:${APIGATEWAY_PORT_TARGET}"  # Host:Container port mapping for API Gateway
    volumes:
      - ../../ebezard-apigateway/app:/app/app                    # Mount API Gateway source code
    depends_on:
      - redis-prod

  nginx-apigateway-prod:
    image: nginx:latest
    container_name: ${PROJECT_NAME}-${NGINX_APIGATEWAY_HOST}-prod
    ports:
      - "${NGINX_APIGATEWAY_PORT_SOURCE}:${NGINX_APIGATEWAY_PORT_TARGET}"
    volumes:
      - ./nginx-apigateway.conf:/etc/nginx/conf.d/apigateway.conf:ro
      - ../../ca/certs/nginx-apigateway-prod-cert.pem:${NGINX_APIGATEWAY_CERT_PATH}:ro
      - ../../ca/keys/nginx-apigateway-prod-key.pem:${NGINX_APIGATEWAY_KEY_PATH}:ro
      - ../../ca/certs/ca-cert.pem:${NGINX_APIGATEWAY_CA_PATH}:ro
    depends_on:
      - apigateway-prod

  landing-prod:
    build:
      context: ../../ebezard-landing/frontend
      dockerfile: Dockerfile-prod
      args:
        LANDING_PORT_TARGET: ${LANDING_PORT_TARGET}
    container_name: ${PROJECT_NAME}-landing-prod
    env_file:
      - .env
    environment:
      VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL}
      VITE_PROJECT_NAME: ${PROJECT_NAME}
      LANDING_PORT_TARGET: ${LANDING_PORT_TARGET}
      HOST: 0.0.0.0
    ports:
      - "${LANDING_PORT_SOURCE}:${LANDING_PORT_TARGET}"
    volumes:
      - ../../ebezard-landing/frontend:/app                      # Mount landing source code
      - /app/node_modules                                        # Persist node_modules for faster installs
    depends_on:
      - apigateway-prod

