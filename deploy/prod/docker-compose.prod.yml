  # Auth database service (PostgreSQL)
  db-auth:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME}-auth-db-prod
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "${AUTH_DB_PORT_SOURCE}:5432"
    volumes:
      - pgdata-auth:/var/lib/postgresql/data

  auth-prod:
    build:
      context: ../../ebezard-auth
      dockerfile: Dockerfile-prod
    container_name: ${PROJECT_NAME}-auth-prod
    env_file:
      - .env
    environment:
      DJANGO_SUPERUSER_USERNAME: ${AUTH_DJANGO_SUPERUSER_USERNAME}
      DJANGO_SUPERUSER_EMAIL: ${AUTH_DJANGO_SUPERUSER_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${AUTH_DJANGO_SUPERUSER_PASSWORD}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      AUTH_DEBUG: ${AUTH_DEBUG}
      ALLOWED_HOSTS_AUTH: ${ALLOWED_HOSTS_AUTH}
    ports:
      - "${AUTH_PORT_SOURCE}:${AUTH_PORT_TARGET}"
    volumes:
      - ../../ebezard-auth:/app
    command: >
      sh -c "/wait-for-it.sh db-auth:5432 -- python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn authserver.wsgi:application --bind 0.0.0.0:${AUTH_PORT_TARGET} --workers 3"
    depends_on:
      - db-auth

  nginx-auth-prod:
    image: nginx:latest
    container_name: ${PROJECT_NAME}-${NGINX_AUTH_HOST}-prod
    ports:
      - "${NGINX_AUTH_PORT_SOURCE}:${NGINX_AUTH_PORT_TARGET}"
    volumes:
      - ./deploy/prod/nginx-auth.conf:/etc/nginx/nginx.conf:ro
      - ${NGINX_AUTH_CERT_PATH}:/etc/nginx/certs/auth-cert.pem:ro
      - ${NGINX_AUTH_KEY_PATH}:/etc/nginx/certs/auth-key.pem:ro
      - ${NGINX_AUTH_CA_PATH}:/etc/nginx/certs/ca-cert.pem:ro
    depends_on:
      - auth-prod

  redis-prod:
    image: redis:7
    restart: always
    container_name: ${PROJECT_NAME}-redis-prod
    ports:
      - "${REDIS_PORT_SOURCE}:${REDIS_PORT_TARGET}"
    volumes:
      - redisdata:/data

volumes:
  pgdata-dev:                                                    # Named volume for main PostgreSQL data
  pgdata-auth:                                                   # Named volume for Auth PostgreSQL data
  redisdata:                                                     # Named volume for Redis data