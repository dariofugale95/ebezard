#
# DOCKER COMPOSE FOR DEVELOPMENT ENVIRONMENT
# All environment variables are managed in the .env file in this directory.
# Modify the .env file to change ports or configuration for backend, frontend, apigateway, and database.
#
services:
  # Backend service (Django)
  backend-dev:
    build:
      context: ../../ebezard-backend
      dockerfile: Dockerfile-dev
    container_name: ${PROJECT_NAME}-${BACKEND_HOSTNAME}
    env_file:
      - .env
    environment:
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME}   # Django superuser username
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL}         # Django superuser email
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}   # Django superuser password
    ports:
      - "${BACKEND_PORT_SOURCE}:${BACKEND_PORT_TARGET}"          # Host:Container port mapping for backend
    volumes:
      - ../../ebezard-backend:/app                               # Mount backend source code
      - ../../ebezard-backend/media:/app/media                   # Mount media directory
    command: >
      sh -c "python manage.py collectstatic --noinput && \
             python manage.py runserver 0.0.0.0:${BACKEND_PORT_TARGET}" # Collect static files and start Django server
    depends_on:
      - db-dev                                                   # Wait for database to be ready

  # Frontend service (React)
  frontend-dev:
    build:
      context: ../../ebezard-frontend/frontend
      dockerfile: Dockerfile-dev
      args:
        FRONTEND_PORT_TARGET: ${FRONTEND_PORT_TARGET}
    container_name: ${PROJECT_NAME}-frontend-dev
    env_file:
      - .env
    environment:
      VITE_TEST_ENV: ${VITE_TEST_ENV}                            # Vite test environment flag
      VITE_BACKEND_URL: ${VITE_BACKEND_URL}                      # Backend URL for frontend
      VITE_PROJECT_NAME: ${VITE_PROJECT_NAME}                    # Project name for branding
      FRONTEND_PORT_TARGET: ${FRONTEND_PORT_TARGET}              # Internal port for frontend
    ports:
      - "${FRONTEND_PORT_SOURCE}:${FRONTEND_PORT_TARGET}"        # Host:Container port mapping for frontend
    volumes:
      - ../../ebezard-frontend/frontend:/app                     # Mount frontend source code
      - /app/node_modules                                        # Persist node_modules for faster installs
    depends_on:
      - backend-dev                                              # Wait for backend to be ready

  # Database service (PostgreSQL)
  db-dev:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME}-db-dev
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}                                # PostgreSQL database name
      POSTGRES_USER: ${POSTGRES_USER}                            # PostgreSQL user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}                    # PostgreSQL password
      DB_PORT_TARGET: ${DB_PORT_TARGET}                          # Internal port for PostgreSQL
    ports:
      - "${DB_PORT_SOURCE}:${DB_PORT_TARGET}"                    # Host:Container port mapping for database
    volumes:
      - pgdata-dev:/var/lib/postgresql/data                      # Persist database data
  
  # API Gateway service (FastAPI)
  apigateway-dev:
    build:
      context: ../../ebezard-apigateway
      dockerfile: Dockerfile-dev
    container_name: ${PROJECT_NAME}-apigateway-dev
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL}
    # ports:
    #   - "${APIGATEWAY_PORT_SOURCE}:${APIGATEWAY_PORT_TARGET}"     # Host:Container port mapping for API Gateway
    volumes:
      - ../../ebezard-apigateway/app:/app/app                    # Mount API Gateway source code
    depends_on:
      - redis-dev
  
  nginx-apigateway-dev:
    image: nginx:latest
    container_name: ${PROJECT_NAME}-${NGINX_APIGATEWAY_HOST}-dev
    ports:
      - "${NGINX_APIGATEWAY_PORT_SOURCE}:${NGINX_APIGATEWAY_PORT_TARGET}"
    volumes:
      - ./nginx-apigateway.conf:/etc/nginx/conf.d/apigateway.conf:ro
      - ../../ca/certs/nginx-apigateway-dev-cert.pem:${NGINX_APIGATEWAY_CERT_PATH}:ro
      - ../../ca/keys/nginx-apigateway-dev-key.pem:${NGINX_APIGATEWAY_KEY_PATH}:ro
      - ../../ca/certs/ca-cert.pem:${NGINX_APIGATEWAY_CA_PATH}:ro
    depends_on:
      - apigateway-dev

  # Landing service (React)
  landing-dev:
    build:
      context: ../../ebezard-landing/frontend
      dockerfile: Dockerfile-dev
      args:
        LANDING_PORT_TARGET: ${LANDING_PORT_TARGET}
    container_name: ${PROJECT_NAME}-landing-dev
    env_file:
      - .env
    environment:
      VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL}              # API Gateway URL for landing
      VITE_PROJECT_NAME: ${PROJECT_NAME}                         # Project name for landing branding
      LANDING_PORT_TARGET: ${LANDING_PORT_TARGET}                # Internal port for landing
      HOST: 0.0.0.0
    ports:
     - "${LANDING_PORT_SOURCE}:${LANDING_PORT_TARGET}"          # Host:Container port mapping for landing
    volumes:
      - ../../ebezard-landing/frontend:/app                      # Mount landing source code
      - /app/node_modules                                        # Persist node_modules for faster installs
    depends_on:
      - apigateway-dev          

