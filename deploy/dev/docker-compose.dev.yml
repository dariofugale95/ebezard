  # Auth database service (PostgreSQL)
  db-auth:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME}-auth-db-dev
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}                                # PostgreSQL database name for Auth
      POSTGRES_USER: ${AUTH_DB_USER}                              # PostgreSQL user for Auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}                      # PostgreSQL password for Auth
      DB_PORT_TARGET: ${AUTH_DB_PORT_TARGET}                      # Internal port for PostgreSQL
    ports:
      - "${AUTH_DB_PORT_SOURCE}:${AUTH_DB_PORT_TARGET}"           # Host:Container port mapping for Auth database
    volumes:
      - pgdata-auth:/var/lib/postgresql/data                      # Persist Auth database data

  # Auth service (Django OAuth2)
  auth-dev:
    build:
      context: ../../ebezard-auth
      dockerfile: Dockerfile-dev
    container_name: ${PROJECT_NAME}-${AUTH_HOSTNAME}
    env_file:
      - .env
    environment:
      DJANGO_SUPERUSER_USERNAME: ${AUTH_DJANGO_SUPERUSER_USERNAME}      # Django superuser username for Auth
      DJANGO_SUPERUSER_EMAIL: ${AUTH_DJANGO_SUPERUSER_EMAIL}            # Django superuser email for Auth
      DJANGO_SUPERUSER_PASSWORD: ${AUTH_DJANGO_SUPERUSER_PASSWORD}      # Django superuser password for Auth
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL}                           # Database connection string for Auth
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}                               # Django secret key for Auth
      AUTH_DEBUG: ${AUTH_DEBUG}                                         # Debug mode for Auth
      ALLOWED_HOSTS_AUTH: ${ALLOWED_HOSTS_AUTH}                         # Allowed hosts for Auth
    ports:
      - "${AUTH_PORT_SOURCE}:${AUTH_PORT_TARGET}"
    volumes:
      - ../../ebezard-auth:/app
    command: >
      sh -c "/wait-for-it.sh db-auth:5432 -- python manage.py migrate &&
            python manage.py collectstatic --noinput &&
            python manage.py runserver 0.0.0.0:${AUTH_PORT_TARGET}"
    depends_on:
      - db-auth

  redis-dev:
    image: redis:7
    restart: always
    container_name: ${PROJECT_NAME}-${REDIS_HOSTNAME}
    ports:
      - "${REDIS_PORT_SOURCE}:${REDIS_PORT_TARGET}"
    volumes:
      - redisdata:/data
      
volumes:
  pgdata-dev:                                                    # Named volume for main PostgreSQL data
  pgdata-auth:                                                   # Named volume for Auth PostgreSQL data
  redisdata:                                                     # Named volume for Redis data