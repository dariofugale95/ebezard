events {}

http {
    server {
        listen 443 ssl;
        server_name sp-dev;

        ssl_certificate     /etc/nginx/certs/sp-cert.pem;
        ssl_certificate_key /etc/nginx/certs/sp-key.pem;
        ssl_client_certificate /etc/nginx/certs/ca-cert.pem;
        ssl_verify_client on;

        location / {
            proxy_pass http://sp-dev:8500;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}